<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCU Connections — Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="styles-mobile.css"/>
<script src="boot.js"></script>
</head>
<body>
<div id="root">
  <div id="mcu-boot" class="boot" data-state="loading" role="status" aria-live="polite">
    <div class="boot-mark" aria-hidden="true"></div>
    <div class="boot-spinner" aria-hidden="true"></div>
    <p class="boot-msg"></p>
    <button class="boot-reload" type="button" hidden></button>
  </div>
</div>

<!-- Languages first (small, local): the startup screen speaks the visitor's
     language while the libraries below download. One catalog per file
     (English is the base), then the runtime. -->
<script src="locales/en.js"></script>
<script src="locales/pt-BR.js"></script>
<script src="i18n.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="media-data.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script type="text/babel" src="poster.jsx"></script>
<script type="text/babel" src="connections.jsx"></script>
<script type="text/babel" src="tracking.jsx"></script>
<script type="text/babel" src="celebrate.jsx"></script>
<script type="text/babel" src="account.jsx"></script>
<script type="text/babel" src="about.jsx"></script>
<script type="text/babel" src="search-suggest.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>
<script type="text/babel" src="desktop-list.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
