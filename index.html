<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Red Thread — Marvel movies, series and character connections</title>
<!-- The name iOS offers for a home-screen icon; without it, it offers the
     whole title above. -->
<meta name="apple-mobile-web-app-title" content="Red Thread"/>
<!-- Tab, home-screen and link-preview identity. Crawlers do not run scripts,
     so the description is the English default; the app itself follows the
     visitor's language. The preview image is served by production (main). -->
<meta name="description" content="See how every Marvel Cinematic Universe film and series connects through shared characters, and track what you have watched."/>
<!-- The browser's own chrome, per system scheme: the design system's
     --background in each theme. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)"/>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="MCU Connections"/>
<meta property="og:title" content="MCU Connections"/>
<meta property="og:description" content="See how every Marvel Cinematic Universe film and series connects through shared characters."/>
<meta property="og:url" content="https://mcu-connections.vercel.app/"/>
<meta property="og:image" content="https://mcu-connections.vercel.app/og-image.jpg"/>
<meta property="og:image:type" content="image/jpeg"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="MCU Connections: titles linked by the characters they share"/>
<meta property="og:locale" content="en_US"/>
<meta property="og:locale:alternate" content="pt_BR"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Only the generated poster art's display face comes from Google Fonts:
     the UI's Inter is the design system's, served with the bundle, and
     numbers use the system monospace. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="styles-mobile.css"/>
<script src="boot.js"></script>
</head>
<body>
<div id="root">
  <div id="mcu-boot" class="boot" data-state="loading" role="status" aria-live="polite">
    <div class="boot-mark logo-mark" aria-hidden="true"></div>
    <div class="boot-spinner" aria-hidden="true"></div>
    <p class="boot-msg"></p>
    <button class="boot-reload" type="button" hidden></button>
  </div>
</div>

<!-- Languages first (small, local): the startup screen speaks the visitor's
     language while the bundle below downloads. One catalog per file
     (English is the base), then the runtime. -->
<script src="locales/en.js"></script>
<script src="locales/pt-BR.js"></script>
<script src="i18n.js"></script>

<script src="https://unpkg.com/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous"></script>

<!-- The whole app is one bundle now (src/main.js): React, the data layer and
     every view. A module script is deferred, so it runs after the libraries
     above and after watch-data.js below, which is what the app expects. -->
<script type="module" src="/src/main.ts"></script>
<script src="watch-data.js"></script>
</body>
</html>
