<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCU Connections — V4 design system</title>
<meta name="robots" content="noindex"/>
<meta name="description" content="Preview of the V4 design system: shadcn/ui on Base UI, Vega style, in light and dark."/>
<!-- Set the theme before first paint so the page never flashes the wrong one.
     This is the one place the rule is duplicated: src/theme.ts owns the
     mechanism, but it arrives with the bundle, which is too late to paint
     with. Key and rule must match STORAGE_KEY and getTheme() there. -->
<script>
  try {
    var saved = localStorage.getItem('mcu.theme');
    var dark = saved === 'dark' || saved === 'light' ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/design/main.tsx"></script>
</body>
</html>
